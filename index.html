<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לילי - מעצבת הדמויות האישית 👗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Assistant', sans-serif;
      background: linear-gradient(135deg, #f0f3ff 0%, #fef3f8 100%);
      min-height: 100vh;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 40px rgba(108, 92, 231, 0.08);
    }

    .custom-shadow {
      filter: drop-shadow(0px 10px 15px rgba(108, 92, 231, 0.15));
    }

    /* Interactive animations */
    .color-swatch {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .color-swatch:hover {
      transform: scale(1.15);
    }
    .color-swatch.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #6c5ce7;
    }

    /* Pulse animation for character base glow */
    @keyframes subtleGlow {
      0%, 100% { filter: drop-shadow(0 15px 25px rgba(253, 121, 168, 0.25)); }
      50% { filter: drop-shadow(0 20px 30px rgba(108, 92, 231, 0.35)); }
    }
    .character-glow {
      animation: subtleGlow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-slate-800 p-4 md:p-8 flex flex-col justify-between min-h-screen">

  <header class="max-w-5xl mx-auto w-full mb-6">
    <div class="glass-card rounded-2xl p-4 md:p-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-200">
          👗
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-indigo-900">לילי (Lily) - סטודיו עיצוב</h1>
          <p class="text-xs md:text-sm text-slate-500 font-medium">דמות וקטורית מתוקה, נקייה ומושלמת בלחיצת כפתור</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="resetCharacter()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
          <span>🔄</span> איפוס מראה
        </button>
        <button onclick="randomizeCharacter()" class="bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md shadow-pink-200 transition transform hover:-translate-y-0.5">
          ✨ האופנה האקראית
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow">
    
    <!-- Character Canvas Card -->
    <div class="lg:col-span-5 glass-card rounded-3xl p-6 flex flex-col items-center justify-center relative overflow-hidden">
      <!-- Background Decorative Aura -->
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-pink-200 rounded-full blur-3xl opacity-60"></div>
      <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-purple-200 rounded-full blur-3xl opacity-60"></div>

      <div class="relative z-10 w-full flex flex-col items-center">
        <!-- SVG Character Wrapper -->
        <div class="w-64 h-96 character-glow flex items-center justify-center my-2">
          <svg id="lily-svg" viewBox="0 0 200 320" class="w-full h-full">
            <defs>
              <!-- Drop Shadow for Accessories -->
              <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
              </filter>
            </defs>

            <!-- Ground Shadow -->
            <ellipse cx="100" cy="305" rx="42" ry="7" fill="#cbd5e1" opacity="0.6"/>

            <!-- Shoes / Footwear -->
            <g id="shoes-group">
              <!-- Left Shoe -->
              <path id="shoe-left" d="M 76 288 Q 70 288 68 296 Q 68 304 84 304 C 88 304 90 298 90 292 L 76 288 Z" fill="#fd79a8" filter="url(#soft-shadow)"/>
              <ellipse cx="80" cy="292" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
              
              <!-- Right Shoe -->
              <path id="shoe-right" d="M 124 288 Q 130 288 132 296 Q 132 304 116 304 C 112 304 110 298 110 292 L 124 288 Z" fill="#fd79a8" filter="url(#soft-shadow)"/>
              <ellipse cx="120" cy="292" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
            </g>

            <!-- Natural Visible Legs -->
            <g id="legs-group">
              <rect x="76" y="195" width="12" height="98" rx="6" fill="#ffe0bd"/>
              <rect x="112" y="195" width="12" height="98" rx="6" fill="#ffe0bd"/>
              <!-- Knee Subtle Highlights -->
              <ellipse cx="82" cy="240" rx="3" ry="1.5" fill="#fcd5b5"/>
              <ellipse cx="118" cy="240" rx="3" ry="1.5" fill="#fcd5b5"/>
            </g>

            <!-- Outfit: Skirt -->
            <path id="skirt" d="M 68 140 L 132 140 L 146 202 C 146 206, 138 210, 100 210 C 62 210, 54 206, 54 202 Z" fill="#6c5ce7" filter="url(#soft-shadow)"/>
            <!-- Skirt Fold Accents -->
            <path d="M 85 140 L 80 206" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
            <path d="M 115 140 L 120 206" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

            <!-- Arms -->
            <g id="arms-group">
              <path d="M 62 100 Q 48 135 52 160 C 53 164 58 164 61 160 Q 68 135 70 105 Z" fill="#ffe0bd"/>
              <path d="M 138 100 Q 152 135 148 160 C 147 164 142 164 139 160 Q 132 135 130 105 Z" fill="#ffe0bd"/>
            </g>

            <!-- Outfit: Top / Blouse -->
            <path id="top-shirt" d="M 68 95 Q 100 105 132 95 L 135 142 L 65 142 Z" fill="#a29bfe"/>
            <!-- Collar / Neckline -->
            <path d="M 85 96 Q 100 110 115 96" fill="none" stroke="#ffe0bd" stroke-width="4" stroke-linecap="round"/>

            <!-- Neck -->
            <rect x="92" y="78" width="16" height="20" rx="4" fill="#ffe0bd"/>
            <ellipse cx="100" cy="94" rx="8" ry="3" fill="#fcd5b5" opacity="0.7"/>

            <!-- Head Base -->
            <circle id="head" cx="100" cy="60" r="28" fill="#ffe0bd"/>

            <!-- Facial Expressions Group -->
            <g id="facial-features">
              <!-- Blush Cheeks -->
              <ellipse cx="82" cy="65" rx="5" ry="3" fill="#fd79a8" opacity="0.55"/>
              <ellipse cx="118" cy="65" rx="5" ry="3" fill="#fd79a8" opacity="0.55"/>

              <!-- Eyes Dynamic Container -->
              <g id="expression-eyes">
                <!-- Happy / Standard Eyes -->
                <circle cx="86" cy="56" r="3.5" fill="#2d3436"/>
                <circle cx="114" cy="56" r="3.5" fill="#2d3436"/>
                <!-- Eye catchlights -->
                <circle cx="85" cy="54.5" r="1.2" fill="#ffffff"/>
                <circle cx="113" cy="54.5" r="1.2" fill="#ffffff"/>
              </g>

              <!-- Mouth Dynamic Container -->
              <g id="expression-mouth">
                <!-- Cute Smile -->
                <path d="M 92 68 Q 100 75 108 68" stroke="#e17055" stroke-width="2.2" stroke-linecap="round" fill="none"/>
              </g>
            </g>

            <!-- Hair Structure -->
            <g id="hair-group">
              <!-- Back Hair extension -->
              <path id="hair-back" d="M 70 50 C 65 85, 60 110, 72 135 C 75 120, 75 80, 75 60 Z M 130 50 C 135 85, 140 110, 128 135 C 125 120, 125 80, 125 60 Z" fill="#5c3d2e"/>
              <!-- Main Front Hair Cut -->
              <path id="hair-main" d="M 68 58 C 65 25, 135 25, 132 58 C 138 32, 130 18, 100 18 C 70 18, 62 32, 68 58 Z" fill="#5c3d2e"/>
              <!-- Bangs / Front Locks -->
              <path id="hair-bangs" d="M 72 48 Q 88 58 100 48 Q 112 58 128 48 Q 115 35 100 36 Q 85 35 72 48 Z" fill="#5c3d2e"/>
            </g>

            <!-- Glasses (Optional) -->
            <g id="accessory-glasses" style="display: none;">
              <circle cx="85" cy="56" r="9" fill="none" stroke="#2d3436" stroke-width="2"/>
              <circle cx="115" cy="56" r="9" fill="none" stroke="#2d3436" stroke-width="2"/>
              <line x1="94" y1="56" x2="106" y2="56" stroke="#2d3436" stroke-width="2"/>
              <line x1="76" y1="56" x2="68" y2="52" stroke="#2d3436" stroke-width="1.5"/>
              <line x1="124" y1="56" x2="132" y2="52" stroke="#2d3436" stroke-width="1.5"/>
            </g>

            <!-- Hair Bow / Flower Accessory (Optional) -->
            <g id="accessory-bow" style="display: none;" transform="translate(118, 25)">
              <path d="M -8 -4 Q 0 0 -8 4 Z" fill="#fd79a8"/>
              <path d="M 8 -4 Q 0 0 8 4 Z" fill="#fd79a8"/>
              <circle cx="0" cy="0" r="3" fill="#ffeaa7"/>
            </g>
          </svg>
        </div>

        <div class="mt-4 text-center">
          <span class="inline-block bg-purple-100 text-purple-700 font-extrabold text-xs px-3 py-1 rounded-full mb-1">תצוגה מקדימה פעילה</span>
          <h2 class="text-xl font-bold text-slate-800">לילי 🌟</h2>
        </div>
      </div>
    </div>

    <!-- Customization Control Panel -->
    <div class="lg:col-span-7 space-y-5">
      
      <!-- Option Tabs / Color Selection Sections -->
      <div class="glass-card rounded-3xl p-5 md:p-6 space-y-6">
        
        <!-- Hair Customization -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center justify-between">
            <span>💇‍♀️ צבע שיער:</span>
            <span id="hair-label" class="text-xs text-purple-600 font-semibold">חום קלאסי</span>
          </label>
          <div class="flex flex-wrap gap-3">
            <button onclick="setHair('#5c3d2e', 'חום קלאסי', this)" class="color-swatch active w-9 h-9 rounded-full bg-[#5c3d2e] border-2 border-white shadow-sm"></button>
            <button onclick="setHair('#2d3436', 'שחור פחם', this)" class="color-swatch w-9 h-9 rounded-full bg-[#2d3436] border-2 border-white shadow-sm"></button>
            <button onclick="setHair('#e17055', 'ג'ינג'י זוהר', this)" class="color-swatch w-9 h-9 rounded-full bg-[#e17055] border-2 border-white shadow-sm"></button>
            <button onclick="setHair('#ffeaa7', 'בלונד זהוב', this)" class="color-swatch w-9 h-9 rounded-full bg-[#ffeaa7] border-2 border-white shadow-sm"></button>
            <button onclick="setHair('#a29bfe', 'סגול פסטל', this)" class="color-swatch w-9 h-9 rounded-full bg-[#a29bfe] border-2 border-white shadow-sm"></button>
            <button onclick="setHair('#fd79a8', 'וורוד מתיקות', this)" class="color-swatch w-9 h-9 rounded-full bg-[#fd79a8] border-2 border-white shadow-sm"></button>
          </div>
        </div>

        <hr class="border-slate-200 opacity-60">

        <!-- Outfit Colors -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center justify-between">
            <span>👗 צבעי חליפה ושמלה:</span>
            <span id="outfit-label" class="text-xs text-purple-600 font-semibold">סגול מודרני</span>
          </label>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setOutfit('#6c5ce7', '#a29bfe', 'סגול מודרני')" class="flex items-center gap-2 p-2 bg-slate-50 hover:bg-purple-50 rounded-xl border border-slate-200 transition text-right">
              <span class="w-6 h-6 rounded-full bg-[#6c5ce7] border border-white inline-block"></span>
              <span class="text-xs font-semibold">סגול קלאסי</span>
            </button>
            <button onclick="setOutfit('#e84393', '#fd79a8', 'ורוד פלמינגו')" class="flex items-center gap-2 p-2 bg-slate-50 hover:bg-pink-50 rounded-xl border border-slate-200 transition text-right">
              <span class="w-6 h-6 rounded-full bg-[#e84393] border border-white inline-block"></span>
              <span class="text-xs font-semibold">ורוד מתוק</span>
            </button>
            <button onclick="setOutfit('#0984e3', '#74b9ff', 'כחול שמיים')" class="flex items-center gap-2 p-2 bg-slate-50 hover:bg-blue-50 rounded-xl border border-slate-200 transition text-right">
              <span class="w-6 h-6 rounded-full bg-[#0984e3] border border-white inline-block"></span>
              <span class="text-xs font-semibold">כחול מלכותי</span>
            </button>
            <button onclick="setOutfit('#00b894', '#55efc4', 'ירוק מנטה')" class="flex items-center gap-2 p-2 bg-slate-50 hover:bg-emerald-50 rounded-xl border border-slate-200 transition text-right">
              <span class="w-6 h-6 rounded-full bg-[#00b894] border border-white inline-block"></span>
              <span class="text-xs font-semibold">ירוק מנטה</span>
            </button>
          </div>
        </div>

        <hr class="border-slate-200 opacity-60">

        <!-- Expression Switcher -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">😊 הבעת פנים:</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setExpression('happy')" class="p-2 bg-white hover:bg-purple-50 rounded-xl border border-slate-200 font-semibold text-xs text-center transition">
              😄 שמחה
            </button>
            <button onclick="setExpression('wink')" class="p-2 bg-white hover:bg-purple-50 rounded-xl border border-slate-200 font-semibold text-xs text-center transition">
              😜 קריצה
            </button>
            <button onclick="setExpression('cool')" class="p-2 bg-white hover:bg-purple-50 rounded-xl border border-slate-200 font-semibold text-xs text-center transition">
              😎 חיוך רחב
            </button>
          </div>
        </div>

        <hr class="border-slate-200 opacity-60">

        <!-- Accessories -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">👓 אקססוריז ותוספות:</label>
          <div class="flex flex-wrap gap-3">
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold hover:bg-slate-100 transition">
              <input type="checkbox" id="toggle-glasses" onchange="toggleGlasses(this.checked)" class="accent-purple-600 rounded">
              <span>משקפיים אופנתיים 👓</span>
            </label>
            
            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold hover:bg-slate-100 transition">
              <input type="checkbox" id="toggle-bow" onchange="toggleBow(this.checked)" class="accent-pink-500 rounded">
              <span>פפיון/פרח לשיער 🎀</span>
            </label>
          </div>
        </div>

        <!-- Footwear Customization -->
        <hr class="border-slate-200 opacity-60">

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">👟 צבע נעליים:</label>
          <div class="flex gap-3">
            <button onclick="setShoes('#fd79a8')" class="w-8 h-8 rounded-full bg-[#fd79a8] border-2 border-white shadow-sm"></button>
            <button onclick="setShoes('#6c5ce7')" class="w-8 h-8 rounded-full bg-[#6c5ce7] border-2 border-white shadow-sm"></button>
            <button onclick="setShoes('#2d3436')" class="w-8 h-8 rounded-full bg-[#2d3436] border-2 border-white shadow-sm"></button>
            <button onclick="setShoes('#ffffff')" class="w-8 h-8 rounded-full bg-[#ffffff] border-2 border-slate-300 shadow-sm"></button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="max-w-5xl mx-auto w-full mt-8 text-center text-xs text-slate-500">
    <p>לילי - דמות וקטורית נקייה, מודרנית ואיכותית SVG | נוצרה באהבה 💖</p>
  </footer>

  <script>
    // State management for Lily's appearance
    const state = {
      hairColor: '#5c3d2e',
      skirtColor: '#6c5ce7',
      topColor: '#a29bfe',
      shoeColor: '#fd79a8',
      expression: 'happy',
      glasses: false,
      bow: false
    };

    function setHair(color, label, element) {
      state.hairColor = color;
      document.getElementById('hair-main').setAttribute('fill', color);
      document.getElementById('hair-back').setAttribute('fill', color);
      document.getElementById('hair-bangs').setAttribute('fill', color);
      document.getElementById('hair-label').innerText = label;

      if (element) {
        document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
      }
    }

    function setOutfit(skirtColor, topColor, label) {
      state.skirtColor = skirtColor;
      state.topColor = topColor;
      document.getElementById('skirt').setAttribute('fill', skirtColor);
      document.getElementById('top-shirt').setAttribute('fill', topColor);
      document.getElementById('outfit-label').innerText = label;
    }

    function setShoes(color) {
      state.shoeColor = color;
      document.getElementById('shoe-left').setAttribute('fill', color);
      document.getElementById('shoe-right').setAttribute('fill', color);
    }

    function setExpression(exp) {
      state.expression = exp;
      const eyesGroup = document.getElementById('expression-eyes');
      const mouthGroup = document.getElementById('expression-mouth');

      if (exp === 'happy') {
        eyesGroup.innerHTML = `
          <circle cx="86" cy="56" r="3.5" fill="#2d3436"/>
          <circle cx="114" cy="56" r="3.5" fill="#2d3436"/>
          <circle cx="85" cy="54.5" r="1.2" fill="#ffffff"/>
          <circle cx="113" cy="54.5" r="1.2" fill="#ffffff"/>
        `;
        mouthGroup.innerHTML = `
          <path d="M 92 68 Q 100 75 108 68" stroke="#e17055" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        `;
      } else if (exp === 'wink') {
        eyesGroup.innerHTML = `
          <!-- Left Winking Eye -->
          <path d="M 81 56 Q 86 51 91 56" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <!-- Right Normal Eye -->
          <circle cx="114" cy="56" r="3.5" fill="#2d3436"/>
          <circle cx="113" cy="54.5" r="1.2" fill="#ffffff"/>
        `;
        mouthGroup.innerHTML = `
          <path d="M 93 67 Q 100 76 107 67 Z" fill="#e17055"/>
        `;
      } else if (exp === 'cool') {
        eyesGroup.innerHTML = `
          <circle cx="86" cy="56" r="4" fill="#2d3436"/>
          <circle cx="114" cy="56" r="4" fill="#2d3436"/>
          <circle cx="84.5" cy="54" r="1.5" fill="#ffffff"/>
          <circle cx="112.5" cy="54" r="1.5" fill="#ffffff"/>
        `;
        mouthGroup.innerHTML = `
          <path d="M 90 66 Q 100 78 110 66" stroke="#e17055" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        `;
      }
    }

    function toggleGlasses(show) {
      state.glasses = show;
      document.getElementById('accessory-glasses').style.display = show ? 'block' : 'none';
    }

    function toggleBow(show) {
      state.bow = show;
      document.getElementById('accessory-bow').style.display = show ? 'block' : 'none';
    }

    function resetCharacter() {
      setHair('#5c3d2e', 'חום קלאסי');
      setOutfit('#6c5ce7', '#a29bfe', 'סגול מודרני');
      setShoes('#fd79a8');
      setExpression('happy');
      
      document.getElementById('toggle-glasses').checked = false;
      toggleGlasses(false);
      
      document.getElementById('toggle-bow').checked = false;
      toggleBow(false);
    }

    function randomizeCharacter() {
      const hairColors = [
        { c: '#5c3d2e', l: 'חום קלאסי' },
        { c: '#2d3436', l: 'שחור פחם' },
        { c: '#e17055', l: 'ג'ינג'י זוהר' },
        { c: '#ffeaa7', l: 'בלונד זהוב' },
        { c: '#a29bfe', l: 'סגול פסטל' },
        { c: '#fd79a8', l: 'וורוד מתיקות' }
      ];
      
      const outfits = [
        { s: '#6c5ce7', t: '#a29bfe', l: 'סגול קלאסי' },
        { s: '#e84393', t: '#fd79a8', l: 'ורוד מתוק' },
        { s: '#0984e3', t: '#74b9ff', l: 'כחול מלכותי' },
        { s: '#00b894', t: '#55efc4', l: 'ירוק מנטה' }
      ];

      const shoeColors = ['#fd79a8', '#6c5ce7', '#2d3436', '#ffffff'];
      const expressions = ['happy', 'wink', 'cool'];

      const randomHair = hairColors[Math.floor(Math.random() * hairColors.length)];
      const randomOutfit = outfits[Math.floor(Math.random() * outfits.length)];
      const randomShoe = shoeColors[Math.floor(Math.random() * shoeColors.length)];
      const randomExp = expressions[Math.floor(Math.random() * expressions.length)];

      setHair(randomHair.c, randomHair.l);
      setOutfit(randomOutfit.s, randomOutfit.t, randomOutfit.l);
      setShoes(randomShoe);
      setExpression(randomExp);

      const randomGlasses = Math.random() > 0.5;
      const randomBow = Math.random() > 0.5;

      document.getElementById('toggle-glasses').checked = randomGlasses;
      toggleGlasses(randomGlasses);

      document.getElementById('toggle-bow').checked = randomBow;
      toggleBow(randomBow);
    }
  </script>
</body>
</html>
