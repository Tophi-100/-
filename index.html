<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת המסלול היומי והלבשת הדמות</title>
    <style>
        :root {
            --primary: #ff6b81;
            --secondary: #70a1ff;
            --accent: #eccc68;
            --bg: #f7f1e3;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .coins-display {
            background: #fff0f5;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: bold;
            color: #d63031;
            border: 2px solid #ff7675;
            font-size: 1.1rem;
        }

        /* מפת המסלול בסללום */
        .map-container {
            background: white;
            border-radius: 25px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            min-height: 450px;
        }

        .map-path {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
        }

        .map-node-row {
            display: flex;
            width: 100%;
            position: relative;
        }

        .map-node-row:nth-child(odd) { justify-content: flex-start; padding-right: 50px; }
        .map-node-row:nth-child(even) { justify-content: flex-end; padding-left: 50px; }

        .node {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #dfe4ea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            color: #747d8c;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .node.active {
            background: var(--primary);
            color: white;
            transform: scale(1.15);
        }

        .node.completed {
            background: #2ed573;
            color: white;
        }

        /* קווים מקווקווים בין התחנות */
        .connector-line {
            position: absolute;
            border-left: 4px dashed #a4b0be;
            z-index: 1;
        }

        .line-1-2 {
            top: 50px;
            right: 80px;
            width: 70%;
            height: 80px;
            transform: rotate(-25deg);
            transform-origin: top right;
        }

        .line-2-3 {
            top: 170px;
            left: 80px;
            width: 70%;
            height: 80px;
            transform: rotate(25deg);
            transform-origin: top left;
        }

        /* הדמות המלווה */
        .buddy-box {
            background: #f1f2f6;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            border: 2px dashed #ced6e0;
        }

        .buddy-avatar-mini {
            width: 70px;
            height: 70px;
            background: #ffeaa7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            position: relative;
        }

        .speech-bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 15px;
            border-bottom-right-radius: 2px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            flex: 1;
            font-size: 0.95rem;
        }

        /* אזור משימה אקטיבית */
        .task-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            margin: 15px 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.05); }

        /* חנות והלבשת הדמות */
        .dressup-section {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .dressup-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
        }

        .character-preview {
            background: #eccc6822;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            position: relative;
        }

        .char-layer {
            position: absolute;
            font-size: 4rem;
            text-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: #f1f2f6;
            border: none;
            padding: 8px 14px;
            border-radius: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: var(--secondary);
            color: white;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
        }

        .item-card {
            border: 2px solid #f1f2f6;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item-card:hover { border-color: var(--primary); }

        .item-card.owned { border-color: #2ed573; background: #e8fae3; }

        .item-price {
            font-size: 0.85rem;
            color: #d63031;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>✨ המסלול היומי שלי</h2>
        <div class="coins-display">🪙 <span id="coinsCount">0</span> מטבעות</div>
    </header>

    <!-- מפת סללום -->
    <div class="map-container">
        <h3>📍 מפת המשימות</h3>
        <div class="map-path">
            <!-- קווים מחברים -->
            <div class="connector-line line-1-2"></div>
            <div class="connector-line line-2-3"></div>

            <div class="map-node-row">
                <div class="node active" id="node-1" onclick="selectTask(1)">1</div>
            </div>
            <div class="map-node-row">
                <div class="node" id="node-2" onclick="selectTask(2)">2</div>
            </div>
            <div class="map-node-row">
                <div class="node" id="node-3" onclick="selectTask(3)">3</div>
            </div>
        </div>

        <!-- דמות מלווה וטיפים -->
        <div class="buddy-box">
            <div class="buddy-avatar-mini" id="mapBuddy">👧</div>
            <div class="speech-bubble" id="buddyTip">
                "היי! אני איתך במסלול. בואי נתחיל את אימון הבוקר ונקבל מטבעות ראשונים!"
            </div>
        </div>
    </div>

    <!-- כרטיס משימה -->
    <div class="task-card">
        <h3 id="taskTitle">משימה 1: אימון בוקר מרענן</h3>
        <p id="taskDesc">מתחילים את היום באנרגיה חיובית עם תרגילים קלים לגוף!</p>
        
        <div class="video-container">
            <iframe id="videoIframe" src="https://www.youtube.com/embed/gC_L9qAHVJ8" allowfullscreen></iframe>
        </div>

        <button class="btn" id="completeBtn" onclick="completeCurrentTask()">סייימתי את המשימה (+15 🪙)</button>
    </div>

    <!-- חנות והלבשת הדמות -->
    <div class="dressup-section">
        <h3>👗 הלבשת הדמות והחנות</h3>
        <div class="dressup-grid">
            <div class="character-preview">
                <div id="charHair" class="char-layer" style="top: 35px; z-index: 3;">🎀</div>
                <div id="charFace" class="char-layer" style="top: 75px; z-index: 2;">👧</div>
                <div id="charTop" class="char-layer" style="top: 115px; z-index: 4;">🧥</div>
                <div id="charBottom" class="char-layer" style="top: 150px; z-index: 3;">👖</div>
                <div id="charShoes" class="char-layer" style="top: 190px; z-index: 3;">👟</div>
            </div>

            <div>
                <div class="categories">
                    <button class="cat-btn active" onclick="filterCategory('shoes')">👟 נעליים (אולסטאר)</button>
                    <button class="cat-btn" onclick="filterCategory('tops')">🧥 סריגי גולף</button>
                    <button class="cat-btn" onclick="filterCategory('bottoms')">👖 ג'ינסים</button>
                    <button class="cat-btn" onclick="filterCategory('skirts')">👗 חצאיות נפנף</button>
                    <button class="cat-btn" onclick="filterCategory('hair')">💇‍♀️ תסרוקות</button>
                </div>

                <div class="items-grid" id="itemsGrid">
                    <!-- הפריטים יוטענו דינמית -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // נתוני משימות מעודכנים כולל סרטונים מתאימים
    const tasks = {
        1: {
            title: "משימה 1: אימון בוקר מרענן",
            desc: "מתיחות וחימום קל לקום איתם בכיף.",
            video: "https://www.youtube.com/embed/gC_L9qAHVJ8",
            tip: "בוקר טוב! אימון בוקר עוזר לרומם את המצבי רוח לכל היום!"
        },
        2: {
            title: "משימה 2: אימון צהריים - חיזוק ודופק",
            desc: "תרגילי סקוואט, לאנג'ים וקפיצות קלות לפריקת אנרגיה.",
            video: "https://www.youtube.com/embed/bdCX8A3oBjg",
            tip: "צהריים טובים! הפסקה פעילה עוזרת להתרענן ולהמשיך את היום בכוחות מחודשים!"
        },
        3: {
            title: "משימה 3: מתיחות והרפיה לערב",
            desc: "שחרור שרירים ורוגע לפני השינה.",
            video: "https://www.youtube.com/embed/inpok4MKVLM",
            tip: "כל הכבוד על המסלול היום! מתיחות בערב יעזרו לך לישון מעולה."
        }
    };

    let currentTask = 1;
    let coins = 0;
    let completedTasks = [];

    // קטלוג פריטים לחנות
    const shopItems = [
        // אולסטאר
        { id: 's1', name: 'אולסטאר שחור', cat: 'shoes', price: 0, icon: '👟', color: 'black' },
        { id: 's2', name: 'אולסטאר אדום קלאסי', cat: 'shoes', price: 15, icon: '👟' },
        { id: 's3', name: 'אולסטאר לבן פלטפורמה', cat: 'shoes', price: 20, icon: '👟' },
        { id: 's4', name: 'אולסטאר ירוק זית', cat: 'shoes', price: 25, icon: '👟' },
        { id: 's5', name: 'אולסטאר סגול פסטל', cat: 'shoes', price: 30, icon: '👟' },
        
        // סריגי גולף
        { id: 't1', name: 'גולף שמנת קלאסי', cat: 'tops', price: 0, icon: '🧥' },
        { id: 't2', name: 'גולף תכלת נעים', cat: 'tops', price: 15, icon: '🧥' },
        { id: 't3', name: 'גולף ורוד עתיק', cat: 'tops', price: 20, icon: '🧥' },
        { id: 't4', name: 'גולף אפור מלנז\'', cat: 'tops', price: 25, icon: '🧥' },

        // ג'ינסים
        { id: 'b1', name: 'ג\'ינס בויפרנד בהיר', cat: 'bottoms', price: 0, icon: '👖' },
        { id: 'b2', name: 'ג\'ינס כהה משופשף', cat: 'bottoms', price: 15, icon: '👖' },
        { id: 'b3', name: 'ג\'ינס שחור סקיני', cat: 'bottoms', price: 20, icon: '👖' },

        // חצאיות נפנף
        { id: 'k1', name: 'חצאית נפנף קפלים לבנה', cat: 'skirts', price: 15, icon: '👗' },
        { id: 'k2', name: 'חצאית נפנף ורודה', cat: 'skirts', price: 20, icon: '👗' },
        { id: 'k3', name: 'חצאית ג\'ינס קצרה', cat: 'skirts', price: 25, icon: '👗' },

        // תסרוקות
        { id: 'h1', name: 'קוקו עם סרט', cat: 'hair', price: 0, icon: '🎀' },
        { id: 'h2', name: 'שיער פזור גלי', cat: 'hair', price: 15, icon: '👩' },
        { id: 'h3', name: 'שתי צמות', cat: 'hair', price: 20, icon: '👧' }
    ];

    let inventory = ['s1', 't1', 'b1', 'h1'];

    function selectTask(id) {
        currentTask = id;
        
        // עדכון תצוגת המפה
        document.querySelectorAll('.node').forEach(node => node.classList.remove('active'));
        document.getElementById(`node-${id}`).classList.add('active');

        // עדכון פרטי משימה
        document.getElementById('taskTitle').innerText = tasks[id].title;
        document.getElementById('taskDesc').innerText = tasks[id].desc;
        document.getElementById('videoIframe').src = tasks[id].video;
        
        // טיפ מהדמות
        document.getElementById('buddyTip').innerText = tasks[id].tip;
    }

    function completeCurrentTask() {
        if (!completedTasks.includes(currentTask)) {
            completedTasks.push(currentTask);
            coins += 15;
            document.getElementById('coinsCount').innerText = coins;
            document.getElementById(`node-${currentTask}`).classList.add('completed');
            
            document.getElementById('buddyTip').innerText = `כל הכבוד! הרווחת 15 מטבעות! 🎉 כנסי לחנות לשדרג אותי!`;

            if(currentTask < 3) {
                selectTask(currentTask + 1);
            }
        } else {
            alert('כבר סיימת את המשימה הזו היום!');
        }
    }

    function filterCategory(cat) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const grid = document.getElementById('itemsGrid');
        grid.innerHTML = '';

        const filtered = shopItems.filter(item => item.cat === cat);
        filtered.forEach(item => {
            const isOwned = inventory.includes(item.id);
            const card = document.createElement('div');
            card.className = `item-card ${isOwned ? 'owned' : ''}`;
            card.innerHTML = `
                <div style="font-size: 2rem;">${item.icon}</div>
                <div style="font-size: 0.85rem; font-weight: bold;">${item.name}</div>
                <div class="item-price">${isOwned ? 'בבעלותך' : item.price + ' 🪙'}</div>
            `;
            card.onclick = () => handleItemClick(item);
            grid.appendChild(card);
        });
    }

    function handleItemClick(item) {
        if (inventory.includes(item.id)) {
            equipItem(item);
        } else if (coins >= item.price) {
            coins -= item.price;
            inventory.push(item.id);
            document.getElementById('coinsCount').innerText = coins;
            equipItem(item);
            filterCategory(item.cat);
        } else {
            alert('אין לך מספיק מטבעות! השלימי משימות במסלול כדי להרוויח עוד.');
        }
    }

    function equipItem(item) {
        if (item.cat === 'shoes') document.getElementById('charShoes').innerText = item.icon;
        if (item.cat === 'tops') document.getElementById('charTop').innerText = item.icon;
        if (item.cat === 'bottoms' || item.cat === 'skirts') {
            document.getElementById('charBottom').innerText = item.icon;
        }
        if (item.cat === 'hair') document.getElementById('charHair').innerText = item.icon;
    }

    // טעינה ראשונית של החנות
    filterCategory('shoes');
</script>

</body>
</html>
