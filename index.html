<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המקום הקסום שלי ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.9);
            --secondary: #4ECDC4;
            --text-color: #2D3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
            min-height: 100vh;
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .header-card {
            background: linear-gradient(135deg, #FF8E53 0%, #FE6B8B 100%);
            color: white;
            text-align: center;
        }

        .header-card h1 {
            font-size: 2.2rem;
            font-weight: 900;
        }

        .profile-setup {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        input[type="text"], input[type="date"] {
            padding: 12px 18px;
            border-radius: 50px;
            border: 2px solid #E0E0E0;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            background: var(--secondary);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .workout-card {
            background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%);
        }

        .workout-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            border-right: 6px solid #6C5CE7;
        }

        .quiz-card {
            background: #FFF9E6;
            border: 2px dashed #FFE66D;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .quiz-btn {
            background: white;
            color: var(--text-color);
            border: 2px solid #FFE66D;
            text-align: right;
            padding: 12px 20px;
            border-radius: 15px;
            font-weight: 600;
        }

        .feedback-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            background: #E8FAE8;
            color: #2D8A2D;
            font-weight: bold;
            display: none;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .day-name {
            font-weight: bold;
            color: #777;
            padding-bottom: 5px;
        }

        .day-cell {
            background: #F7F9FC;
            border-radius: 12px;
            padding: 8px 4px;
            min-height: 95px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #EAEFF5;
            cursor: pointer;
        }

        .day-cell:hover {
            background: #FFF0F5;
            border-color: #FF85A1;
        }

        .day-cell.today {
            background: #E3F2FD;
            border: 2px solid #42A5F5;
            font-weight: bold;
        }

        .holiday-tag { background: #FFD166; color: #333; font-size: 0.65rem; border-radius: 6px; padding: 2px 4px; margin-top: 2px; width: 100%; }
        .workout-tag { background: #6C5CE7; color: white; font-size: 0.65rem; border-radius: 6px; padding: 2px 4px; margin-top: 2px; width: 100%; }
        .no-workout-tag { background: #E0E0E0; color: #666; font-size: 0.65rem; border-radius: 6px; padding: 2px 4px; margin-top: 2px; width: 100%; }
        .event-tag { background: #FF85A1; color: white; font-size: 0.65rem; border-radius: 6px; padding: 2px 4px; margin-top: 2px; width: 100%; }

        .add-event-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #E0E0E0;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card header-card">
        <h1 id="greeting">שלום לך! 🌟</h1>
        <p id="sub-greeting">כיף שקפצת לבקר! שיהיה לך יום מושלם 🎉</p>
        <div class="profile-setup">
            <input type="text" id="username-input" placeholder="איך קוראים לך? 😊">
            <button onclick="saveName()">שמור קוראים לי ככה!</button>
        </div>
    </div>

    <div class="card workout-card">
        <h3>🏋️‍♀️ אימון כושר יומי מתוכנן</h3>
        <div class="workout-box" id="today-workout-display">טוען...</div>
    </div>

    <div class="card quiz-card">
        <h3 id="quiz-title">מה שלומך עכשיו? 🤔</h3>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="feedback-msg" id="feedback"></div>
    </div>

    <div class="card">
        <h3 id="month-year-title">📅 לוח שנה (לחצי על יום בלוח!)</h3>
        <div class="calendar-grid" id="calendar-grid"></div>

        <div class="add-event-form">
            <input type="date" id="event-date">
            <input type="text" id="event-title" placeholder="תיאור אירוע..." style="flex: 1;">
            <button onclick="addEventFromForm()">הוסף ללו"ז 📌</button>
        </div>
    </div>

</div>

<script>
    const workoutSchedule = {
        1: "יום ראשון: פלג גוף עליון 💪 (שקילת שמיכה, מתח/אוסטרלי, מקבילים)",
        2: "יום שני: רגליים ובטן 🦵 (סקוואטים, מכרעים, הרמות רגליים)",
        3: "יום שלישי: אימון אירובי + ליבה 🏃‍♀️ (קפיצות בחבל, פלאנק, גשר)",
        4: "יום רביעי: פלג גוף עליון וגב 🏋️‍♀️ (עבודה על טכניקה ומתח)",
        5: "יום חמישי: אימון גוף מלא 🔥 (סבבים של כל התרגילים)",
        0: "יום שישי: מנוחה והתאוששות ☕ (יוגה/מתיחות קלות)",
        6: "יום שבת: מנוחה מלאה 🎈 (זמן איכות וכיף)"
    };

    const holidays = {
        "2026-09-12": "ראש השנה 🍎",
        "2026-09-13": "ראש השנה 🍎",
        "2026-09-21": "יום כיפור 🕊️",
        "2026-09-26": "סוכות 🌿",
        "2026-10-03": "שמחת תורה 📜"
    };

    let userEvents = JSON.parse(localStorage.getItem('my_user_events')) || {};
    let workoutPreferences = JSON.parse(localStorage.getItem('my_workout_prefs')) || {};

    window.onload = function() {
        loadUserProfile();
        setupDynamicQuiz();
        renderCalendar();
        displayTodayWorkout();
    };

    function saveName() {
        const name = document.getElementById('username-input').value.trim();
        if (name) {
            localStorage.setItem('my_site_username', name);
            loadUserProfile();
            setupDynamicQuiz();
            document.getElementById('username-input').value = '';
        }
    }

    function loadUserProfile() {
        const name = localStorage.getItem('my_site_username') || 'רני';
        const hour = new Date().getHours();
        let greetingText = (hour >= 5 && hour < 12) ? `בוקר טוב, ${name}! ☀️✨` : (hour >= 12 && hour < 17) ? `צהריים טובים, ${name}! 🥪🎉` : `ערב טוב, ${name}! 🌆🎨`;
        document.getElementById('greeting').innerText = greetingText;
    }

    function displayTodayWorkout() {
        const dayOfWeek = new Date().getDay();
        const workoutDay = (dayOfWeek + 1) % 7; 
        document.getElementById('today-workout-display').innerText = workoutSchedule[workoutDay];
    }

    function setupDynamicQuiz() {
        const hour = new Date().getHours();
        const name = localStorage.getItem('my_site_username') || '';
        const nameStr = name ? ` ${name}` : '';
        const quizTitle = document.getElementById('quiz-title');
        const quizOptions = document.getElementById('quiz-options');

        if (hour >= 11 && hour <= 16) {
            quizTitle.innerText = `איך היה בבית הספר היום${nameStr}? 🏫✨`;
            quizOptions.innerHTML = `
                <button class="quiz-btn" onclick="answerQuiz('היה ממש כיף ומצחיק! 🎉')">😍 היה ממש כיף ומצחיק!</button>
                <button class="quiz-btn" onclick="answerQuiz('המורה הייתה קרציה... 😴')">🙄 כמה קרציה המורה הייתה הפעם!</button>
                <button class="quiz-btn" onclick="answerQuiz('עבר בסדר, העיקר שבבית! 🏠')">🛋️ עבר בסדר, העיקר שאני בבית!</button>
            `;
        } else {
            quizTitle.innerText = `איך מרגיש היום שלך${nameStr}? 🌈`;
            quizOptions.innerHTML = `
                <button class="quiz-btn" onclick="answerQuiz('אנרגיה מעולה! 🚀')">🚀 באנרגיות שיא למעשים טובים!</button>
                <button class="quiz-btn" onclick="answerQuiz('במצב רוח לרגוע ☕')">😴 במצב רוח רגוע ונינוח.</button>
            `;
        }
    }

    function answerQuiz(responseText) {
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        feedback.innerText = `תשובה מעולה! "${responseText}" - שיהיה המשך יום מקסים! ❤️✨`;
    }

    function renderCalendar() {
        const calendarGrid = document.getElementById('calendar-grid');
        calendarGrid.innerHTML = '';

        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
        document.getElementById('month-year-title').innerText = `📅 לוח שנה - ${monthNames[month]} ${year}`;

        ['א\'', 'ב\'', 'ג\'', 'ד\'', 'ה\'', 'ו\'', 'ש\''].forEach(day => {
            const div = document.createElement('div');
            div.className = 'day-name';
            div.innerText = day;
            calendarGrid.appendChild(div);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell';
            emptyCell.style.background = 'transparent';
            emptyCell.style.border = 'none';
            emptyCell.style.cursor = 'default';
            calendarGrid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            const currentCellDate = new Date(year, month, day);
            const dayOfWeek = currentCellDate.getDay();

            if (day === now.getDate()) dayCell.classList.add('today');
            dayCell.innerHTML = `<span>${day}</span>`;

            const monthFormatted = String(month + 1).padStart(2, '0');
            const dayFormatted = String(day).padStart(2, '0');
            const fullDateStr = `${year}-${monthFormatted}-${dayFormatted}`;

            // בלחיצה על היום בלוח – קופצת השאלה הישירה!
            dayCell.onclick = () => processEventCreation(fullDateStr);

            if (holidays[fullDateStr]) {
                const holidayTag = document.createElement('div');
                holidayTag.className = 'holiday-tag';
                holidayTag.innerText = holidays[fullDateStr];
                dayCell.appendChild(holidayTag);
            }

            const pref = workoutPreferences[fullDateStr];
            if (pref === true || (pref === undefined && dayOfWeek >= 0 && dayOfWeek <= 4)) {
                const workoutTag = document.createElement('div');
                workoutTag.className = 'workout-tag';
                workoutTag.innerText = "🏋️‍♀️ אימון";
                dayCell.appendChild(workoutTag);
            } else if (pref === false) {
                const noWorkoutTag = document.createElement('div');
                noWorkoutTag.className = 'no-workout-tag';
                noWorkoutTag.innerText = "☕ ללא אימון";
                dayCell.appendChild(noWorkoutTag);
            }

            if (userEvents[fullDateStr]) {
                userEvents[fullDateStr].forEach(evt => {
                    const eventTag = document.createElement('div');
                    eventTag.className = 'event-tag';
                    eventTag.innerText = `📌 ${evt}`;
                    dayCell.appendChild(eventTag);
                });
            }

            calendarGrid.appendChild(dayCell);
        }
    }

    // הפונקציה הראשית ששואלת באופן ישיר
    function processEventCreation(dateStr, prefilledTitle = "") {
        let eventTitle = prefilledTitle;
        if (!eventTitle) {
            eventTitle = prompt(`מה האירוע או המשימה שתרצי להוסיף לתאריך ${dateStr}?`);
        }

        // אם המשתמשת הזינה אירוע (או לחצה אישור)
        if (eventTitle !== null) {
            if (eventTitle.trim() !== "") {
                if (!userEvents[dateStr]) userEvents[dateStr] = [];
                userEvents[dateStr].push(eventTitle.trim());
                localStorage.setItem('my_user_events', JSON.stringify(userEvents));
            }

            // השאלה לגבי האימון
            const wantsWorkout = confirm(`מתאים לך לעשות אימון בתאריך ${dateStr}?\n\nלחצי 'אישור' ל-כן 👍 | לחצי 'ביטול' ל-לא 😴`);
            workoutPreferences[dateStr] = wantsWorkout;
            localStorage.setItem('my_workout_prefs', JSON.stringify(workoutPreferences));

            renderCalendar();
        }
    }

    function addEventFromForm() {
        const dateInput = document.getElementById('event-date').value;
        const titleInput = document.getElementById('event-title').value.trim();

        if (!dateInput) {
            alert('נא לבחור תאריך! 😊');
            return;
        }

        processEventCreation(dateInput, titleInput);
        document.getElementById('event-title').value = '';
    }
</script>

</body>
</html>
