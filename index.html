<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>האתר של רני</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    /* עיצוב סרגל צדדי */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1000;
      top: 0;
      right: 0;
      background-color: #2c3e50;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.2);
    }

    .sidebar a {
      padding: 12px 24px;
      text-decoration: none;
      font-size: 18px;
      color: #ecf0f1;
      display: block;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background-color: #34495e;
      color: #ffffff;
    }

    .sidebar h3 {
      color: #fff;
      padding: 0 24px;
      margin-bottom: 20px;
    }

    .sidebar .close-btn {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 32px;
      color: #fff;
    }

    .open-btn {
      font-size: 18px;
      cursor: pointer;
      background-color: #2c3e50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    /* עיצוב כללי ותצוגת יתרה */
    .wallet {
      background-color: #fff;
      border: 2px solid #27ae60;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #27ae60;
      display: inline-block;
    }

    .section-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    .quiz-option {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background-color: #ecf0f1;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      cursor: pointer;
      text-align: right;
      font-size: 16px;
    }

    .quiz-option:hover {
      background-color: #d5dbdb;
    }

    .btn-action {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-action:hover {
      background-color: #3498db;
    }

    .feedback {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- כפתור לפתיחת סרגל הצד -->
  <button class="open-btn" onclick="toggleSidebar()">☰ תפריט ניווט</button>

  <!-- סרגל צדדי -->
  <div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">&times;</a>
    <h3>ניווט באתר</h3>
    <a href="#quiz-section" onclick="toggleSidebar()">📝 חידון ה-20 (שקל לשאלה!)</a>
    <a href="#lilys-closet" onclick="toggleSidebar()" style="color: #f1c40f; font-weight: bold;">👗 הארון של לילי</a>
  </div>

  <!-- תצוגת יתרת הכסף (מאופס ל-0) -->
  <div class="wallet">
    💰 יתרה בחשבון: <span id="money-amount">0</span> ₪
  </div>

  <!-- אזור החידון -->
  <div id="quiz-section" class="section-card">
    <h2>⚡ חידון ה-20 (הכי הוגן, ציני ומציק ברשת)</h2>
    <p>עונים נכון על שאלה ומרוויחים <strong>1 ₪</strong> למאזן!</p>

    <div id="quiz-container">
      <h3 id="question-text">טוען שאלה...</h3>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="btn-action" style="display:none;" onclick="loadRandomQuestion()">לשאלה הצינית הבאה 👈</button>
    </div>
  </div>

  <!-- אזור הארון של לילי -->
  <div id="lilys-closet" class="section-card">
    <h2>👗 הארון של לילי</h2>
    <p>ברוכים הבאים לארון של לילי! כאן תוכלו לצפות בפרטים, לעצב מראה ייחודי או לרכוש פריטים בעזרת המטבעות שהרווחתם.</p>
  </div>

  <script>
    // ניהול כסף
    let currentBalance = 0;

    function updateBalance(amount) {
      currentBalance += amount;
      document.getElementById('money-amount').innerText = currentBalance;
    }

    // פתיחה וסגירה של סרגל הצד
    function toggleSidebar() {
      const sidebar = document.getElementById("mySidebar");
      if (sidebar.style.width === "250px") {
        sidebar.style.width = "0";
      } else {
        sidebar.style.width = "250px";
      }
    }

    // מאגר שאלות ציניות ומשעשעות
    const cynicalQuestions = [
      {
        q: "מה הדבר הראשון שאנשים עושים כשהם קמים בבוקר?",
        options: ["קמים בריצה ומחייכים לעולם", "בוהים בטלפון 40 דקות ותוהים למה הם קמו", "עושים יוגה ב-5 בבוקר", "שותים מיץ ירוק מגעיל"],
        correct: 1
      },
      {
        q: "מה קורה כשאומרים למשהו 'אני עוד 5 דקות שם'?",
        options: ["אתה כבר בדלת", "אתה עוד לא בחרת מה ללבוש", "אתה ברכב בדרך", "הגעת לפני הזמן"],
        correct: 1
      },
      {
        q: "מה התפקיד האמיתי של סוללה ב-1%?",
        options: ["לשרוד עוד 3 שעות לפחות", "לכבות בדיוק כשאתה באמצע לכתוב הודעה חשובה", "להטעין את עצמה מחדש בקסם", "להתריע בנימוס"],
        correct: 1
      },
      {
        q: "איך יודעים שמשהו ממש חשוב?",
        options: ["כתבו אותו בחדשות", "אמא אמרה את זה שלוש פעמים ברצף", "יש על זה ערך בויקיפדיה", "מישהו העלה על זה סרטון בטיקטוק"],
        correct: 1
      },
      {
        q: "מה קורה לגרביים שנעלמות בכביסה?",
        options: ["הן עוברות לממד מקביל של גרביים בודדות", "הן הופכות לאבק", "החתול אכל אותן", "הן פשוט הלכו לטייל"],
        correct: 0
      },
      {
        q: "מהי הדרך הטובה ביותר לזכור משהו דחוף?",
        options: ["לכתוב בפתקים", "לשכוח אותו ולזכור שניה אחרי שזה כבר לא רלוונטי", "לבקש מחבר שיזכיר", "לשים שעון מעורר"],
        correct: 1
      },
      {
        q: "מה עושים כשהאינטרנט פתאום נתקע?",
        options: ["ממתינים בסבלנות", "מכבים ומדליקים את הראוטר בפרצוף עצבני", "קוראים ספר", "יוצאים לנוף ליהנות מהטבע"],
        correct: 1
      }
    ];

    let currentQuestion = null;

    function loadRandomQuestion() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('next-btn').style.display = 'none';

      // בחירת שאלה רנדומלית
      const randomIndex = Math.floor(Math.random() * cynicalQuestions.length);
      currentQuestion = cynicalQuestions[randomIndex];

      document.getElementById('question-text').innerText = currentQuestion.q;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentQuestion.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const feedback = document.getElementById('feedback');
      const allButtons = document.querySelectorAll('.quiz-option');
      allButtons.forEach(b => b.disabled = true);

      if (selectedIndex === currentQuestion.correct) {
        feedback.innerText = "🎉 וואו, יפה! צדקת. הרווחת 1 ₪!";
        feedback.style.color = "green";
        updateBalance(1);
      } else {
        feedback.innerText = "❌ טעות! לא נורא, אולי בפעם הבאה יתמזל מזלך...";
        feedback.style.color = "red";
      }

      document.getElementById('next-btn').style.display = 'inline-block';
    }

    // טעינת שאלה ראשונה בטעינת הדף
    window.onload = loadRandomQuestion;
  </script>

</body>
</html>
