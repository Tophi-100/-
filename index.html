<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המשחק המשודרג</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #FFE5EC 0%, #F0E6FF 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            gap: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* עיצוב הדמות האהובה והקלאסית */
        .character-stage {
            width: 220px;
            height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .pet-body {
            width: 140px;
            height: 140px;
            background: #FF9AA2;
            border-radius: 50%;
            position: relative;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(255,154,162,0.4);
            transition: transform 0.2s, background-color 0.3s;
            animation: bounce 2s infinite ease-in-out;
        }

        .pet-eye {
            width: 18px;
            height: 24px;
            background: #2C3E50;
            border-radius: 50%;
            position: absolute;
            top: 45px;
        }

        .pet-eye.left { left: 35px; }
        .pet-eye.right { right: 35px; }

        .pet-eye::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            top: 3px;
            right: 3px;
        }

        .pet-blush {
            width: 22px;
            height: 12px;
            background: #FFB7B2;
            border-radius: 50%;
            position: absolute;
            top: 72px;
            opacity: 0.8;
        }

        .pet-blush.left { left: 20px; }
        .pet-blush.right { right: 20px; }

        .pet-mouth {
            width: 20px;
            height: 10px;
            border-bottom: 4px solid #2C3E50;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 70px;
            left: 60px;
        }

        /* פריטי לבוש עליה */
        .hat-item {
            position: absolute;
            top: -25px;
            font-size: 55px;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* מתכונים */
        .recipe-box {
            background: #FFF9E6;
            border: 2px dashed #FFE066;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            margin-bottom: 15px;
            text-align: center;
        }

        .recipe-title {
            font-weight: bold;
            color: #D69E2E;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .recipe-desc {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn {
            background: #FFB7B2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover {
            background: #FF9AA2;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* חנות שהתכווצה */
        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #EEE;
            border-radius: 12px;
            background: #FAFAFA;
        }

        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .buy-btn {
            width: auto;
            padding: 6px 14px;
            font-size: 0.9rem;
            background: #B5EAD7;
            color: #2D6A4F;
        }

        .buy-btn:hover {
            background: #95D5B2;
        }

        .alert-text {
            color: #E63946;
            font-size: 0.85rem;
            margin-top: 5px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-badge">💰 <span id="coins">0</span> מטבעות</div>
        <div class="stat-badge">⭐ רמה <span id="level">1</span></div>
    </div>

    <div class="game-container">
        
        <!-- כרטיס דמות -->
        <div class="card">
            <h3>הדמות שלך</h3>
            <div class="character-stage">
                <div class="hat-item" id="equippedHat"></div>
                <div class="pet-body" id="petBody">
                    <div class="pet-eye left"></div>
                    <div class="pet-eye right"></div>
                    <div class="pet-blush left"></div>
                    <div class="pet-blush right"></div>
                    <div class="pet-mouth"></div>
                </div>
            </div>
            <p id="statusMsg">המפלצת רעבה ומחכה למשהו מצחיק!</p>
        </div>

        <!-- כרטיס המטבח המטורלל -->
        <div class="card">
            <h3>מטבח המתכונים המשתנים 🍳</h3>
            <div class="recipe-box">
                <div class="recipe-title" id="recipeTitle">טוען מתכון...</div>
                <div class="recipe-desc" id="recipeDesc">...</div>
                <button class="btn" onclick="cookRecipe()">הכן את הטירוף הזה!</button>
            </div>
            <div class="alert-text" id="cookMsg"></div>
        </div>

        <!-- חנות הבגדים הזעירה -->
        <div class="card">
            <h3>חנות בגדים (זעירה במיוחד! 😱)</h3>
            <p style="font-size: 0.8rem; color: #888;">החנות הצטמצמה מסיבות לא ברורות. המחירים יקרים!</p>
            
            <div class="shop-items">
                <div class="shop-item">
                    <div class="shop-item-info">
                        <span style="font-size:1.5rem;">👑</span>
                        <div>
                            <div>כתר זהב מוזהב</div>
                            <small>50 מטבעות</small>
                        </div>
                    </div>
                    <button class="btn buy-btn" onclick="buyItem('👑', 50)">קנה</button>
                </div>

                <div class="shop-item">
                    <div class="shop-item-info">
                        <span style="font-size:1.5rem;">🎀</span>
                        <div>
                            <div>פפיון ורוד חמוד</div>
                            <small>30 מטבעות</small>
                        </div>
                    </div>
                    <button class="btn buy-btn" onclick="buyItem('🎀', 30)">קנה</button>
                </div>

                <div class="shop-item">
                    <div class="shop-item-info">
                        <span style="font-size:1.5rem;">🎩</span>
                        <div>
                            <div>כובע קוסמים יוקרתי</div>
                            <small>80 מטבעות</small>
                        </div>
                    </div>
                    <button class="btn buy-btn" onclick="buyItem('🎩', 80)">קנה</button>
                </div>
            </div>
            <div class="alert-text" id="shopMsg"></div>
        </div>

    </div>

    <script>
        let coins = 0;
        let level = 1;
        let currentRecipe = {};

        // מאגר מתכונים קורעים מצחוק שמתחלפים כל הזמן
        const funnyRecipes = [
            { title: "חביתת גרביים מוקפצת", desc: "קח גרב ישנה, רסס עליה מיץ לימון ותעשה קולות של תרנגולת עד שזה מוכן.", reward: 4 },
            { title: "פיצה בלי פיצה", desc: "שים צלחת ריקה בתנור. תדמיין גבינה צהובה ונמס . תצעק 'פיצה!' שלוש פעמים.", reward: 3 },
            { title: "מרק עננים מצחיק", desc: "תאסוף אדים מהמקלחת, תוסיף קורטוב של צחוק של מכשפה ותערבב עם כף עץ.", reward: 5 },
            { title: "עוגת בננה מבוהלת", desc: "תבהיל בננה עד שהיא תהפוך לצהובה יותר, מעך אותה עם המרפק ושים במקרר.", reward: 6 },
            { title: "שיפוד פסטה לא מבושלת", desc: "קח אטריה קשה, תנסה לנגן עליה בגיטרה, ואז תגיד לדמות שזה גורמה.", reward: 2 },
            { title: "סלט קוביות קרח חמות", desc: "חמם קרח במיקרוגל עד שהוא נעלם. תתלונן שהסלט יצא מים.", reward: 4 },
            { title: "שוקו מים בטעם שוקולד", desc: "תסתכל על תמונה של שוקולד בזמן שאתה שותה כוס מים פושרים.", reward: 7 }
        ];

        function generateNewRecipe() {
            const randomIndex = Math.floor(Math.random() * funnyRecipes.length);
            currentRecipe = funnyRecipes[randomIndex];
            document.getElementById('recipeTitle').innerText = currentRecipe.title;
            document.getElementById('recipeDesc').innerText = currentRecipe.desc;
        }

        function cookRecipe() {
            // הקפצת כסף בסכומים קטנים וקשים
            coins += currentRecipe.reward;
            document.getElementById('coins').innerText = coins;
            
            document.getElementById('cookMsg').innerText = `בישלת! הרווחת ${currentRecipe.reward} מטבעות בקושי...`;
            document.getElementById('statusMsg').innerText = `הדמות אכלה "${currentRecipe.title}" וצוחקת!`;

            // אפקט ויזואלי קטן לדמות
            const pet = document.getElementById('petBody');
            pet.style.transform = 'scale(1.15)';
            setTimeout(() => pet.style.transform = 'scale(1)', 200);

            // החלפת מתכון למשהו חדש ומצחיק
            setTimeout(() => {
                document.getElementById('cookMsg').innerText = '';
                generateNewRecipe();
            }, 1500);
        }

        function buyItem(icon, price) {
            const msgEl = document.getElementById('shopMsg');
            if (coins >= price) {
                coins -= price;
                document.getElementById('coins').innerText = coins;
                document.getElementById('equippedHat').innerText = icon;
                msgEl.style.color = '#2D6A4F';
                msgEl.innerText = "תתחדש! מראה מדהים!";
            } else {
                msgEl.style.color = '#E63946';
                msgEl.innerText = "אין לך מספיק מטבעות! לך לבשל עוד מתכונים מצחיקים...";
            }
            setTimeout(() => msgEl.innerText = '', 2500);
        }

        // התחלת המשחק
        generateNewRecipe();
    </script>
</body>
</html>
